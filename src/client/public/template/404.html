<!DOCTYPE html>
<html lang="zh-CN" class="yobot-ui">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · 页面未找到</title>
  {% include 'partials/ui_head.html' %}
  <link rel="stylesheet" href="{{ url_for('yobot_static', filename='ui/error.css') }}">
</head>
<body class="ui-error">
  <main id="app" aria-labelledby="error-title">
    <header class="error-heading"><span>YOBOT</span><span>页面未找到</span></header>
    <div class="error-content">
      <div class="error-code" aria-hidden="true">404</div>
      <h1 id="error-title">这个{{ item | default('页面', true) | e }}不存在</h1>
      <p>请检查链接是否正确，或返回个人中心选择公会。</p>
      <nav class="error-actions" aria-label="返回导航">
        <a class="error-action error-action-primary" href="{{ url_for('yobot_user') }}">返回个人中心</a>
        <button class="error-action" type="button" data-fallback="{{ url_for('yobot_user') }}"
          onclick="if (history.length > 1 && document.referrer.startsWith(location.origin + '/')) { history.back(); } else { location.assign(this.dataset.fallback); }">返回上一页</button>
      </nav>
    </div>
  </main>
  {% include 'partials/ui_footer.html' %}
</body>
</html>
